<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CSV Maker | FreeToolsHub</title><meta name="description" content="Turn simple rows into CSV."><link rel="stylesheet" href="style.css"></head><body><header><a class="logo" href="index.html">Free<span>Tools</span>Hub</a></header><main><section class="hero"><h1>CSV Maker</h1><p>Turn simple rows into CSV.</p><div class="toolbox"><textarea id="t" rows="10" placeholder="Name,Age&#10;Ali,20"></textarea><button onclick="go()">Make CSV</button><pre id="out"></pre></div></section></main><footer>© 2026 FreeToolsHub</footer><script>function go(){out.textContent=t.value.split(/\\n/).map(x=>x.split(",").map(v=>"\\""+v.replaceAll("\\"","\\"\\"")+"\\"").join(",")).join("\\n")}</script></body></html>
