<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Random Number Generator | FreeToolsHub</title><meta name="description" content="Generate a random number in a range."><link rel="stylesheet" href="style.css"></head><body><header><a class="logo" href="index.html">Free<span>Tools</span>Hub</a></header><main><section class="hero"><h1>Random Number Generator</h1><p>Generate a random number in a range.</p><div class="toolbox"><input id="a" type="number" placeholder="Min"><input id="b" type="number" placeholder="Max"><button onclick="go()">Generate</button><p id="out"></p></div></section></main><footer>© 2026 FreeToolsHub</footer><script>function go(){let x=+a.value,y=+b.value;out.textContent=Math.floor(Math.random()*(y-x+1))+x}</script></body></html>
