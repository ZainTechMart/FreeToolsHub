<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Loan Payment Calculator | FreeToolsHub</title><meta name="description" content="Estimate monthly loan payments."><link rel="stylesheet" href="style.css"></head><body><header><a class="logo" href="index.html">Free<span>Tools</span>Hub</a></header><main><section class="hero"><h1>Loan Payment Calculator</h1><p>Estimate monthly loan payments.</p><div class="toolbox"><input id="amt" type="number" placeholder="Loan amount"><input id="rate" type="number" placeholder="Annual interest %"><input id="yrs" type="number" placeholder="Years"><button onclick="go()">Calculate</button><p id="out"></p></div></section></main><footer>© 2026 FreeToolsHub</footer><script>function go(){let P=+amt.value,r=+rate.value/1200,n=+yrs.value*12,m=r?P*r/(1-(1+r)**-n):P/n;out.textContent="Monthly payment: "+m.toFixed(2)}</script></body></html>
