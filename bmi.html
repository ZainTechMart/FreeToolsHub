<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BMI Calculator | FreeToolsHub</title><meta name="description" content="Calculate body mass index."><link rel="stylesheet" href="../css/style.css"></head><body><header><a class="logo" href="../index.html">Free<span>Tools</span>Hub</a></header><main><section class="hero"><h1>BMI Calculator</h1><p>Calculate body mass index.</p><div class="toolbox"><input id="w" type="number" placeholder="Weight (kg)"><input id="h" type="number" placeholder="Height (cm)"><button onclick="go()">Calculate</button><p id="out"></p></div></section></main><footer>© 2026 FreeToolsHub</footer><script>function go(){let x=+w.value/(+h.value/100)**2;out.textContent="BMI: "+x.toFixed(1)}</script></body></html>
