<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tip Calculator | FreeToolsHub</title><meta name="description" content="Calculate tip and split a bill."><link rel="stylesheet" href="style.css"></head><body><header><a class="logo" href="index.html">Free<span>Tools</span>Hub</a></header><main><section class="hero"><h1>Tip Calculator</h1><p>Calculate tip and split a bill.</p><div class="toolbox"><input id="bill" type="number" placeholder="Bill amount"><input id="tip" type="number" placeholder="Tip %"><input id="people" type="number" value="1" placeholder="People"><button onclick="go()">Calculate</button><p id="out"></p></div></section></main><footer>© 2026 FreeToolsHub</footer><script>function go(){let t=+bill.value*(+tip.value/100),total=+bill.value+t;out.textContent=`Tip: ${t.toFixed(2)} | Total: ${total.toFixed(2)} | Per person: ${(total/+people.value).toFixed(2)}`} </script></body></html>
