<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JSON Formatter | FreeToolsHub</title><meta name="description" content="Format and validate JSON."><link rel="stylesheet" href="../css/style.css"></head><body><header><a class="logo" href="../index.html">Free<span>Tools</span>Hub</a></header><main><section class="hero"><h1>JSON Formatter</h1><p>Format and validate JSON.</p><div class="toolbox"><textarea id="t" rows="12" placeholder="{&quot;hello&quot;:&quot;world&quot;}"></textarea><button onclick="go()">Format</button><p id="out"></p></div></section></main><footer>© 2026 FreeToolsHub</footer><script>function go(){try{t.value=JSON.stringify(JSON.parse(t.value),null,2);out.textContent="Valid JSON"}catch(e){out.textContent="Invalid JSON"}}</script></body></html>
