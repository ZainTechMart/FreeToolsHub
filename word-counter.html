<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Word Counter | FreeToolsHub</title><meta name="robots" content="index,follow"><meta name="description" content="Count words and characters."><link rel="icon" href="favicon.svg"><link rel="stylesheet" href="style.css"></head><body><header><a class="logo" href="index.html">Free<span>Tools</span>Hub</a></header><main><section class="hero"><h1>Word Counter</h1><p>Count words and characters.</p><div class="toolbox"><textarea id="t" rows="10" placeholder="Type or paste text"></textarea><p id="out"></p></div></section></main><footer>© 2026 FreeToolsHub · <a href="index.html">Home</a> · <a href="privacy.html">Privacy</a> · <a href="terms.html">Terms</a> · <a href="disclaimer.html">Disclaimer</a></footer><script>t.oninput=()=>{let s=t.value;out.textContent=`Words: ${(s.trim().match(/\\S+/g)||[]).length} | Characters: ${s.length}`} </script></body></html>
